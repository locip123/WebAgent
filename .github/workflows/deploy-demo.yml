name: Deploy product demo

on:
  push:
    branches:
      - main
      - agent/pandasai-chart-data-actions
      - sync-wr-047-local-20260905
    paths:
      - "demo/**"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Stage the demo site
        run: |
          mkdir -p _site
          cp demo/index.html _site/index.html
          cp demo/demo.mp4 _site/demo.mp4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
