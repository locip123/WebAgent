      - fastapi==0.115.6
      - uvicorn==0.34.0
      - sse-starlette==2.1.3
      - python-dotenv==1.2.2
      - requests==2.33.0
      - screeninfo==0.8.1
      - typing-extensions==4.15.0
      - tiktoken==0.13.0
      - uuid7==0.1.0
      - google-genai==1.65.0
